<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>ブロック崩しプロトタイプ</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }
    body {
      background-color: #1a1a1a;
      color: #ffffff;
      font-family: 'Helvetica Neue', Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      overflow: hidden;
    }

    /* 20:9 アスペクト比を維持するコンテナ */
    .game-container {
      position: relative;
      width: 100vw;
      max-width: 400px;
      height: calc(100vw * 20 / 9);
      max-height: 888px;
      background-color: #000;
      box-shadow: 0 0 20px rgba(0, 0, 0, 0.8);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* 上部スコアヘッダー */
    .header {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 50px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 12px;
      background: rgba(25, 25, 25, 0.85);
      z-index: 10;
    }

    .score-container {
      font-size: 18px;
      font-weight: bold;
    }

    /* スコア増加時の振動アニメーション */
    .shake {
      display: inline-block;
      animation: shake-anim 0.2s ease-in-out;
      color: #ff0;
    }

    @keyframes shake-anim {
      0% { transform: translate(0, 0) scale(1.2); }
      25% { transform: translate(-3px, 2px) scale(1.2); }
      50% { transform: translate(3px, -2px) scale(1.2); }
      75% { transform: translate(-2px, -1px) scale(1.1); }
      100% { transform: translate(0, 0) scale(1); }
    }

    /* 左上ハイスコア表示エリア */
    .highscore-box {
      position: absolute;
      top: 55px;
      left: 8px;
      background: rgba(0, 0, 0, 0.6);
      padding: 6px 10px;
      border-radius: 6px;
      border: 1px solid rgba(255, 255, 255, 0.2);
      font-size: 10px;
      z-index: 9;
      pointer-events: none;
    }

    .highscore-box h3 {
      font-size: 11px;
      color: #feca57;
      margin-bottom: 3px;
      text-transform: uppercase;
    }

    .highscore-box ol {
      padding-left: 14px;
      margin: 0;
    }

    .highscore-box li {
      color: #ddd;
      line-height: 1.2;
    }

    /* 左右の危険発光ライン */
    .danger-line {
      position: absolute;
      top: 50px;
      bottom: 0;
      width: 4px;
      background: #ff0055;
      box-shadow: 0 0 8px #ff0055, 0 0 12px #ff0055;
      z-index: 5;
      pointer-events: none;
      animation: pulse-danger 1.5s infinite alternate ease-in-out;
    }

    .danger-line.left { left: 0; }
    .danger-line.right { right: 0; }

    @keyframes pulse-danger {
      0% { opacity: 0.2; }
      100% { opacity: 0.8; }
    }

    canvas {
      width: 100%;
      height: 100%;
      display: block;
      background-color: #111;
      cursor: pointer;
    }

    /* チュートリアル / 結果画面 オーバーレイ */
    .overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.88);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 24px;
      z-index: 20;
      text-align: center;
    }

    .overlay.hidden {
      display: none;
    }

    .overlay h1 {
      font-size: 26px;
      margin-bottom: 16px;
      color: #00f3ff;
      text-shadow: 0 0 10px rgba(0, 243, 255, 0.5);
    }

    .tutorial-content {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 20px;
      font-size: 13px;
      line-height: 1.6;
      color: #e0e0e0;
      text-align: left;
    }

    .tutorial-content ul {
      margin-top: 8px;
      padding-left: 20px;
    }

    .tutorial-content li {
      margin-bottom: 6px;
    }

    .highlight-text {
      color: #ffd700;
      font-weight: bold;
    }

    .highlight-danger {
      color: #ff4757;
      font-weight: bold;
    }

    .target-msg {
      margin-top: 12px;
      font-size: 15px;
      font-weight: bold;
      color: #2ed573;
      text-align: center;
    }

    .btn {
      padding: 12px 32px;
      font-size: 16px;
      font-weight: bold;
      background-color: #ff4757;
      color: white;
      border: none;
      border-radius: 24px;
      cursor: pointer;
      box-shadow: 0 4px 12px rgba(255, 71, 87, 0.4);
    }

    .btn:active {
      transform: scale(0.95);
    }
  </style>
</head>
<body>

  <div class="game-container">
    <!-- 画面左右の赤く発光する危険ライン -->
    <div class="danger-line left"></div>
    <div class="danger-line right"></div>

    <!-- UI ヘッダー -->
    <div class="header">
      <div class="score-container">SCORE: <span id="score">0</span></div>
      <div id="status" style="font-size: 12px; color: #aaa;">タッチで操作</div>
    </div>

    <!-- 左上 ハイスコア TOP5 -->
    <div class="highscore-box">
      <h3>TOP 5</h3>
      <ol id="highscore-list">
        <li>-</li>
        <li>-</li>
        <li>-</li>
        <li>-</li>
        <li>-</li>
      </ol>
    </div>

    <!-- ゲーム描画用 Canvas -->
    <canvas id="gameCanvas"></canvas>

    <!-- チュートリアル / 結果画面 -->
    <div id="overlay" class="overlay">
      <h1 id="overlay-title">遊び方説明</h1>
      
      <div id="tutorial-box" class="tutorial-content">
        <p><strong>【コンボとスコアの仕組み】</strong></p>
        <ul>
          <li>壁に当たらず連続でブロックを壊すと<span class="highlight-text">コンボ発生！</span>獲得スコアが倍増します(2Combo, 3Combo...)。</li>
          <li><span class="highlight-danger">左右の赤く光る壁</span>にボールが当たるとコンボがリセットされます(※上部の壁は安全)。</li>
          <li>金色の<span class="highlight-text">[UP]アイテム</span>を取ると、10ptブロックが50ptの高得点ブロックへ変化！</li>
        </ul>
        <div class="target-msg">🔥 ハイスコア更新を目指そう！ 🔥</div>
      </div>

      <p id="overlay-desc" style="display: none; font-size: 18px; margin-bottom: 20px;"></p>
      
      <button id="start-btn" class="btn">ゲームスタート</button>
    </div>
  </div>

  <script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const scoreEl = document.getElementById('score');
    const overlay = document.getElementById('overlay');
    const overlayTitle = document.getElementById('overlay-title');
    const overlayDesc = document.getElementById('overlay-desc');
    const tutorialBox = document.getElementById('tutorial-box');
    const startBtn = document.getElementById('start-btn');
    const highscoreListEl = document.getElementById('highscore-list');

    // 内部解像度 (20:9: 幅360px x 高さ800px)
    const GAME_WIDTH = 360;
    const GAME_HEIGHT = 800;
    canvas.width = GAME_WIDTH;
    canvas.height = GAME_HEIGHT;

    // ゲーム状態
    let score = 0;
    let globalCombo = 0;
    let isGameRunning = false;
    let animationFrameId = null;

    // エフェクト要素
    let popups = [];
    let items = [];
    let balls = [];
    let particles = [];

    const BASE_BALL_SPEED = 6.6;

    // パドル
    const paddle = {
      width: 80,
      height: 12,
      x: (GAME_WIDTH - 80) / 2,
      y: GAME_HEIGHT - 100,
      speed: 8,
      dx: 0
    };

    function createBall(x, y, dx, dy) {
      return { x: x, y: y, radius: 6, dx: dx, dy: dy };
    }

    // ブロックパラメータ
    const TOTAL_BLOCKS = 100;
    const COLS = 10;
    const BLOCK_SIZE = ((GAME_WIDTH - (COLS + 1) * 2) / COLS) * 0.5;
    const TOP_LIMIT = 60;
    const BOTTOM_LIMIT = GAME_HEIGHT * (2 / 3);

    let blocks = [];

    // ハイスコア読み込み・保存
    function loadHighScores() {
      try {
        const saved = localStorage.getItem('breakout_highscores');
        if (saved) {
          const parsed = JSON.parse(saved);
          if (Array.isArray(parsed)) {
            return parsed.map(n => Number(n) || 0).sort((a, b) => b - a).slice(0, 5);
          }
        }
      } catch (e) {}
      return [0, 0, 0, 0, 0];
    }

    function saveHighScore(newScore) {
      if (newScore <= 0) return;
      let scores = loadHighScores();
      scores.push(newScore);
      scores.sort((a, b) => b - a);
      scores = scores.slice(0, 5);
      localStorage.setItem('breakout_highscores', JSON.stringify(scores));
      updateHighScoreUI(scores);
    }

    function updateHighScoreUI(scores = loadHighScores()) {
      highscoreListEl.innerHTML = scores
        .map(s => `<li>${s > 0 ? s + ' pt' : '-'}</li>`)
        .join('');
    }

    function shuffle(array) {
      for (let i = array.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [array[i], array[j]] = [array[j], array[i]];
      }
      return array;
    }

    function isOverlapping(x1, y1, x2, y2, size) {
      return !(x1 + size + 2 <= x2 || x1 >= x2 + size + 2 || y1 + size + 2 <= y2 || y1 >= y2 + size + 2);
    }

    function initBlocks() {
      blocks = [];
      
      let types = [
        ...Array(10).fill({ pt: 30, color: '#ff4757' }),
        ...Array(20).fill({ pt: 20, color: '#ffa502' }),
        ...Array(70).fill({ pt: 10, color: '#2ed573' })
      ];
      types = shuffle(types);

      let hasItemFlags = Array(100).fill(false);
      for (let i = 0; i < 5; i++) {
        hasItemFlags[i] = true;
      }
      hasItemFlags = shuffle(hasItemFlags);

      for (let i = 0; i < TOTAL_BLOCKS; i++) {
        let x, y, overlaps;
        let attempts = 0;
        
        do {
          overlaps = false;
          x = Math.random() * (GAME_WIDTH - BLOCK_SIZE - 8) + 4;
          y = Math.random() * (BOTTOM_LIMIT - TOP_LIMIT - BLOCK_SIZE) + TOP_LIMIT;

          for (let b of blocks) {
            if (isOverlapping(x, y, b.x, b.y, BLOCK_SIZE)) {
              overlaps = true;
              break;
            }
          }
          attempts++;
        } while (overlaps && attempts < 500);

        blocks.push({
          x: x,
          y: y,
          width: BLOCK_SIZE,
          height: BLOCK_SIZE,
          pt: types[i].pt,
          color: types[i].color,
          hasItem: hasItemFlags[i],
          status: 1
        });
      }
    }

    // 操作処理
    function handleMove(clientX) {
      const rect = canvas.getBoundingClientRect();
      const scaleX = GAME_WIDTH / rect.width;
      const canvasX = (clientX - rect.left) * scaleX;
      
      paddle.x = canvasX - paddle.width / 2;
      paddle.x = Math.max(0, Math.min(GAME_WIDTH - paddle.width, paddle.x));
    }

    window.addEventListener('mousemove', (e) => handleMove(e.clientX));
    window.addEventListener('touchmove', (e) => {
      if (e.touches.length > 0) handleMove(e.touches[0].clientX);
    }, { passive: true });

    const keys = {};
    window.addEventListener('keydown', (e) => keys[e.code] = true);
    window.addEventListener('keyup', (e) => keys[e.code] = false);

    function addScore(points) {
      score += points;
      scoreEl.textContent = score;
      
      scoreEl.classList.remove('shake');
      void scoreEl.offsetWidth;
      scoreEl.classList.add('shake');
    }

    function createComboPopup(x, y, comboCount) {
      const colors = ['#ffffff', '#00d2d3', '#54a0ff', '#5f27cd', '#ff9ff3', '#ff6b6b', '#feca57'];
      const colorIndex = Math.min(comboCount - 1, colors.length - 1);
      
      popups.push({
        x: x,
        y: y,
        text: `${comboCount} Combo!`,
        fontSize: Math.min(14 + comboCount * 2, 32),
        color: colors[colorIndex],
        alpha: 1.0,
        dy: -1.5
      });
    }

    function createBlockBreakParticles(x, y, color) {
      const particleCount = 8;
      for (let i = 0; i < particleCount; i++) {
        const angle = Math.random() * Math.PI * 2;
        const speed = Math.random() * 3 + 1;
        particles.push({
          x: x + BLOCK_SIZE / 2,
          y: y + BLOCK_SIZE / 2,
          dx: Math.cos(angle) * speed,
          dy: Math.sin(angle) * speed,
          size: Math.random() * 3 + 2,
          color: color,
          alpha: 1.0
        });
      }
    }

    function applyUpgradeIncentive() {
      const lowPtBlocks = blocks.filter(b => b.status === 1 && b.pt === 10);
      const shuffled = shuffle([...lowPtBlocks]);
      const targets = shuffled.slice(0, 5);

      targets.forEach(b => {
        b.pt = 50;
        b.color = '#ffd700';
      });

      if (targets.length > 0) {
        popups.push({
          x: GAME_WIDTH / 2,
          y: GAME_HEIGHT / 2,
          text: `50pt BLOCK UPGRADE!`,
          fontSize: 20,
          color: '#ffd700',
          alpha: 1.0,
          dy: -1.0
        });
      }
    }

    function resetGame() {
      score = 0;
      globalCombo = 0;
      scoreEl.textContent = '0';
      popups = [];
      items = [];
      particles = [];
      
      paddle.x = (GAME_WIDTH - paddle.width) / 2;
      
      const initialAngle = (Math.random() > 0.5 ? 1 : -1) * 3.5;
      balls = [
        createBall(GAME_WIDTH / 2, paddle.y - 20, initialAngle, -BASE_BALL_SPEED)
      ];

      initBlocks();
      updateHighScoreUI();
    }

    function startGame() {
      resetGame();
      overlay.classList.add('hidden');
      isGameRunning = true;
      if (animationFrameId) cancelAnimationFrame(animationFrameId);
      gameLoop();
    }

    function endGame(isWin) {
      isGameRunning = false;
      saveHighScore(score);

      // 結果画面用のUIへ切り替え
      overlayTitle.textContent = isWin ? 'CLEAR!!' : 'GAME OVER';
      tutorialBox.style.display = 'none'; // チュートリアル部分を非表示
      overlayDesc.style.display = 'block';
      overlayDesc.textContent = `最終スコア: ${score} pt`;
      startBtn.textContent = 'もう一度プレイ';
      overlay.classList.remove('hidden');
    }

    function update() {
      if (keys['ArrowLeft'] || keys['KeyA']) {
        paddle.x -= paddle.speed;
        if (paddle.x < 0) paddle.x = 0;
      }
      if (keys['ArrowRight'] || keys['KeyD']) {
        paddle.x += paddle.speed;
        if (paddle.x + paddle.width > GAME_WIDTH) paddle.x = GAME_WIDTH - paddle.width;
      }

      for (let bIndex = balls.length - 1; bIndex >= 0; bIndex--) {
        const ball = balls[bIndex];
        
        ball.x += ball.dx;
        ball.y += ball.dy;

        // 左右壁（コンボリセット）
        if (ball.x - ball.radius < 0) {
          ball.x = ball.radius;
          ball.dx *= -1;
          globalCombo = 0;
        } else if (ball.x + ball.radius > GAME_WIDTH) {
          ball.x = GAME_WIDTH - ball.radius;
          ball.dx *= -1;
          globalCombo = 0;
        }

        // 上部壁（安全）
        if (ball.y - ball.radius < 50) {
          ball.y = 50 + ball.radius;
          ball.dy *= -1;
        }

        // 落下
        if (ball.y + ball.radius > GAME_HEIGHT) {
          balls.splice(bIndex, 1);
          continue;
        }

        // パドル衝突
        if (
          ball.y + ball.radius >= paddle.y &&
          ball.y - ball.radius <= paddle.y + paddle.height &&
          ball.x >= paddle.x &&
          ball.x <= paddle.x + paddle.width &&
          ball.dy > 0
        ) {
          ball.dy *= -1;
          const hitPoint = (ball.x - (paddle.x + paddle.width / 2)) / (paddle.width / 2);
          ball.dx = hitPoint * 6;
        }

        // ブロック衝突
        for (let i = 0; i < blocks.length; i++) {
          const b = blocks[i];
          if (b.status === 1) {
            if (
              ball.x + ball.radius > b.x &&
              ball.x - ball.radius < b.x + b.width &&
              ball.y + ball.radius > b.y &&
              ball.y - ball.radius < b.y + b.height
            ) {
              b.status = 0;
              ball.dy *= -1;

              createBlockBreakParticles(b.x, b.y, b.color);

              globalCombo++;
              addScore(b.pt * globalCombo);

              if (globalCombo >= 2) {
                createComboPopup(ball.x, ball.y, globalCombo);
              }

              if (b.hasItem) {
                items.push({
                  x: b.x + b.width / 2,
                  y: b.y + b.height / 2,
                  radius: 8,
                  dy: 2.5
                });
              }

              break;
            }
          }
        }
      }

      if (balls.length === 0) {
        globalCombo = 0;
        endGame(false);
        return;
      }

      const remainingBlocks = blocks.filter(b => b.status === 1).length;
      if (remainingBlocks === 0) {
        endGame(true);
        return;
      }

      for (let i = items.length - 1; i >= 0; i--) {
        const item = items[i];
        item.y += item.dy;

        if (
          item.y + item.radius >= paddle.y &&
          item.y - item.radius <= paddle.y + paddle.height &&
          item.x >= paddle.x &&
          item.x <= paddle.x + paddle.width
        ) {
          applyUpgradeIncentive();
          items.splice(i, 1);
          continue;
        }

        if (item.y - item.radius > GAME_HEIGHT) {
          items.splice(i, 1);
        }
      }

      for (let i = popups.length - 1; i >= 0; i--) {
        const p = popups[i];
        p.y += p.dy;
        p.alpha -= 0.02;
        if (p.alpha <= 0) popups.splice(i, 1);
      }

      for (let i = particles.length - 1; i >= 0; i--) {
        const pt = particles[i];
        pt.x += pt.dx;
        pt.y += pt.dy;
        pt.alpha -= 0.04;
        if (pt.alpha <= 0) particles.splice(i, 1);
      }
    }

    function draw() {
      ctx.clearRect(0, 0, GAME_WIDTH, GAME_HEIGHT);

      for (let i = 0; i < blocks.length; i++) {
        const b = blocks[i];
        if (b.status === 1) {
          ctx.fillStyle = b.color;
          ctx.fillRect(b.x, b.y, b.width, b.height);

          if (b.pt === 50) {
            ctx.strokeStyle = '#ffffff';
            ctx.lineWidth = 1;
            ctx.strokeRect(b.x, b.y, b.width, b.height);
          }
        }
      }

      for (let pt of particles) {
        ctx.save();
        ctx.globalAlpha = Math.max(0, pt.alpha);
        ctx.fillStyle = pt.color;
        ctx.fillRect(pt.x, pt.y, pt.size, pt.size);
        ctx.restore();
      }

      for (let item of items) {
        ctx.beginPath();
        ctx.arc(item.x, item.y, item.radius, 0, Math.PI * 2);
        ctx.fillStyle = '#ffd700';
        ctx.fill();
        ctx.strokeStyle = '#ffffff';
        ctx.lineWidth = 1.5;
        ctx.stroke();
        ctx.closePath();

        ctx.fillStyle = '#111111';
        ctx.font = 'bold 8px sans-serif';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText('UP', item.x, item.y);
      }

      ctx.save();
      ctx.shadowColor = '#00f3ff';
      ctx.shadowBlur = 12;
      const gradient = ctx.createLinearGradient(paddle.x, paddle.y, paddle.x, paddle.y + paddle.height);
      gradient.addColorStop(0, '#80f7ff');
      gradient.addColorStop(1, '#00c3ff');
      ctx.fillStyle = gradient;
      ctx.beginPath();
      ctx.roundRect(paddle.x, paddle.y, paddle.width, paddle.height, 6);
      ctx.fill();
      ctx.restore();

      for (let ball of balls) {
        ctx.beginPath();
        ctx.arc(ball.x, ball.y, ball.radius, 0, Math.PI * 2);
        ctx.fillStyle = '#ffffff';
        ctx.fill();
        ctx.closePath();
      }

      for (let p of popups) {
        ctx.save();
        ctx.globalAlpha = Math.max(0, p.alpha);
        ctx.font = `bold ${p.fontSize}px sans-serif`;
        ctx.fillStyle = p.color;
        ctx.textAlign = 'center';
        ctx.shadowColor = '#000';
        ctx.shadowBlur = 4;
        ctx.fillText(p.text, p.x, p.y);
        ctx.restore();
      }
    }

    function gameLoop() {
      if (!isGameRunning) return;
      update();
      draw();
      animationFrameId = requestAnimationFrame(gameLoop);
    }

    startBtn.addEventListener('click', startGame);

    updateHighScoreUI();
    initBlocks();
    draw();
  </script>
</body>
</html>
